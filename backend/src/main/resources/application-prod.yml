# ============================================================
#  Profil PRODUCTION
#  Toutes les valeurs sensibles proviennent de variables
#  d'environnement : aucun secret n'est stocke dans le code.
# ============================================================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

server:
  error:
    include-message: never
    include-binding-errors: never

logging:
  level:
    root: WARN
    tn.iset.gabes.helpdesk: INFO
