# ============================================================
#  Helpdesk - Configuration principale
#  Projet de Fin d'Etudes - ISET Gabes
# ============================================================
spring:
  application:
    name: helpdesk
  profiles:
    active: dev

  # Fichier de secrets local, facultatif et jamais versionne.
  # Il porte les identifiants du compte administrateur initial, afin
  # qu'ils ne figurent dans aucun fichier suivi par Git.
  # En production, ces memes valeurs viennent de variables
  # d'environnement ou de Secret Manager.
  config:
    import: optional:file:./secrets.properties

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  # Serveur d'envoi de courriels.
  # Volontairement generique : les memes reglages conviennent a Gmail,
  # Resend, Brevo ou au serveur d'un hebergeur. Les valeurs sensibles
  # viennent de variables d'environnement.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  # Le port 8080 est souvent deja pris sur un poste de developpement, par
  # exemple par le listener Oracle ou par Tomcat de XAMPP. Le port est donc
  # surchargeable par la variable d'environnement SERVER_PORT.
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

# ------------------------------------------------------------
#  Parametres metier de l'application
# ------------------------------------------------------------
helpdesk:
  # URL publique du frontend (utilisee dans les QR codes)
  frontend-url: http://localhost:4200

  # Compte administrateur cree au tout premier demarrage, et uniquement
  # si la base est vide. A renseigner par variables d'environnement :
  #     HELPDESK_ADMIN_EMAIL       HELPDESK_ADMIN_PASSWORD
  # Aucune valeur par defaut n'est prevue : un mot de passe connu
  # d'avance ouvrirait l'acces a toutes les donnees.
  admin:
    email: ${HELPDESK_ADMIN_EMAIL:}
    password: ${HELPDESK_ADMIN_PASSWORD:}
    full-name: ${HELPDESK_ADMIN_NAME:Administrateur}
    phone: ${HELPDESK_ADMIN_PHONE:}

  security:
    jwt:
      # IMPORTANT : en production, surcharger via la variable d'environnement JWT_SECRET
      secret: ${JWT_SECRET:ZmE5YzQ4YjJlNzE2ZDMwNWE4YzFmNDdiOTJkNmUzMDhhNWMyZjc0YjFkOGU2YzNhOTViMmQ3ZTRmODFjNmEzYg==}
      # Duree de validite du token d'acces (24 heures en millisecondes)
      expiration: 86400000
      # Duree de validite du refresh token (7 jours)
      refresh-expiration: 604800000

  # Delais de resolution contractuels (SLA) exprimes en heures
  sla:
    critical: 2
    high: 8
    medium: 24
    low: 72
    # Frequence de verification des SLA depasses (expression cron)
    check-cron: "0 */5 * * * *"

  cors:
    allowed-origins: http://localhost:4200,http://127.0.0.1:4200

  # Courriels de notification.
  # Desactives tant qu'aucun serveur SMTP n'est configure : l'application
  # fonctionne alors normalement, sans courriel.
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Depanio}

  # Maintien en eveil, utile seulement sur un hebergement qui met le
  # service en veille apres quelques minutes d'inactivite.
  keep-alive:
    enabled: ${KEEP_ALIVE_ENABLED:false}
    cron: ${KEEP_ALIVE_CRON:0 */10 * * * *}

# ------------------------------------------------------------
#  Documentation de l'API
# ------------------------------------------------------------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# ------------------------------------------------------------
#  Supervision
# ------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    tn.iset.gabes.helpdesk: DEBUG
