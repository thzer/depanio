# ============================================================
#  Profil DEVELOPPEMENT
#  Base de donnees MySQL / MariaDB fournie par XAMPP
#  Prerequis : demarrer MySQL depuis le panneau de controle XAMPP
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/helpdesk_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Tunis&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # update : Hibernate cree et met a jour les tables automatiquement
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  sql:
    init:
      mode: never

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
